<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Probar Auth API</title>
</head>

<body>
    <h1>REGISTRO</h1>
    <form id="registerForm">
        <input type="text" id="username" placeholder="Nombre de usuario" required><br>
        <input type="password" id="password" placeholder="Contraseña" required><br>
        <button type="submit">Registrarse</button>
    </form>

    <h1 id="loginTitle" style="display: none;">LOGIN</h1>
    <form id="loginForm" style="display: none;">
        <input type="text" id="loginUsername" placeholder="Nombre de usuario" required><br>
        <input type="password" id="loginPassword" placeholder="Contraseña" required><br>
        <button type="submit">Iniciar Sesión</button>
    </form>

    <script src="script.js"></script>
</body>

</html>
